apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cyberfaces-rag-data-pvc
  namespace: cyberfaces-cms
  labels:
    app: cyberfaces-rag
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: anvil-filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cyberfaces-rag-data-sync
  namespace: cyberfaces-cms
  labels:
    app: cyberfaces-rag
spec:
  schedule: "0 * * * *"
  # Replace a still-running (e.g. stuck) job at the next tick instead of
  # blocking it, and skip a tick that cannot start within 2 min.
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Fail a run that hangs (e.g. stuck on a bad node's volume mount) after
      # 5 min so it frees the slot instead of hanging forever; retry up to 3x.
      activeDeadlineSeconds: 300
      backoffLimit: 3
      template:
        spec:
          # No GPU toleration: data-sync needs no GPU, so keep it off the
          # GPU-tainted nodes (one of which has a broken cephfs CSI mount that
          # leaves the pod stuck in ContainerCreating) and run on regular nodes.
          restartPolicy: OnFailure
          containers:
          - name: data-sync
            image: registry.anvil.rcac.purdue.edu/cyberfaces/cyberfaces-rag-data-sync:latest
            imagePullPolicy: Always
            env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cyberfaces-db-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyberfaces-db-secrets
                  key: db-password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cyberfaces-db-secrets
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cyberfaces-db-secrets
                  key: db-name
            - name: TABLE
              value: "course_units"
            - name: DATA_DIR
              value: "/data"
            - name: CHROMADB_DIR
              value: "/data/chromaDB"
            volumeMounts:
            - name: data-storage
              mountPath: /data
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: data-storage
            persistentVolumeClaim:
              claimName: cyberfaces-rag-data-pvc
